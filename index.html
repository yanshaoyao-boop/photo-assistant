<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>老公拍照辅助器 - 拯救废片</title>
    <meta name="description" content="帮助老公拍出完美照片的智能辅助工具，构图引导、防短腿、氛围滤镜一应俱全">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="app-container">
        <!-- 启动授权屏幕 -->
        <div id="start-screen" class="start-screen">
            <div class="start-content">
                <div class="start-icon">📸</div>
                <h2>老公拍照辅助器</h2>
                <p class="start-subtitle">让每一张都是大片</p>
                <p class="start-desc">为保证辅助线与水平仪正常工作<br>请点击下方按钮并允许权限</p>
                <button id="start-btn" class="start-btn">✨ 授权并开启系统</button>
                <div id="error-log" class="error-log"></div>
            </div>
        </div>

        <!-- 摄像头画面容器 -->
        <div class="camera-wrapper">
            <video id="camera-feed" autoplay playsinline webkit-playsinline x5-video-player-type="h5"></video>

            <!-- 顶部工具栏 -->
            <div class="top-toolbar">
                <button id="toggle-filter-btn" class="toolbar-btn">🎨 滤镜</button>
                <div id="timer-display" class="timer-display hidden"></div>
                <div class="zoom-controls hidden" id="zoom-controls">
                    <button class="zoom-btn active" data-zoom="1">1x</button>
                    <button class="zoom-btn" data-zoom="2">2x</button>
                    <button class="zoom-btn" data-zoom="3">3x</button>
                </div>
            </div>

            <!-- 滤镜选项抽屉 -->
            <div id="filter-drawer" class="filter-drawer hidden">
                <button class="filter-opt active" data-filter="none">🔲 原图</button>
                <button class="filter-opt" data-filter="sepia(0.15) saturate(1.4) contrast(1.05) brightness(1.12)">🌸
                    日系</button>
                <button class="filter-opt"
                    data-filter="contrast(1.2) saturate(1.15) sepia(0.3) hue-rotate(-10deg) brightness(0.92)">🎞️
                    胶片</button>
                <button class="filter-opt" data-filter="grayscale(1) contrast(1.25)">🖤 黑白</button>
                <button class="filter-opt" data-filter="sepia(0.25) saturate(1.5) brightness(1.05) hue-rotate(10deg)">🌅
                    落日</button>
                <button class="filter-opt" data-filter="saturate(0.9) brightness(1.15) contrast(0.95)">🍦 奶油</button>
                <button class="filter-opt"
                    data-filter="saturate(1.8) contrast(1.3) hue-rotate(180deg) brightness(0.85)">💜 赛博</button>
            </div>

            <!-- 姿势指导话术框 -->
            <div id="pose-tip" class="pose-tip hidden">
                <span>💡 提示：请她...</span>
            </div>

            <!-- 倒计时大数字 -->
            <div id="countdown-overlay" class="countdown-overlay hidden">
                <span id="countdown-number">3</span>
            </div>

            <!-- 叠加层：九宫格 -->
            <div id="grid-overlay" class="overlay grid-overlay">
                <div class="grid-line vertical line-1"></div>
                <div class="grid-line vertical line-2"></div>
                <div class="grid-line horizontal line-1"></div>
                <div class="grid-line horizontal line-2"></div>
                <div class="grid-point p1"></div>
                <div class="grid-point p2"></div>
                <div class="grid-point p3"></div>
                <div class="grid-point p4"></div>
            </div>

            <!-- 叠加层：辅助蒙版图 -->
            <div id="silhouette-overlay" class="overlay silhouette-layer hidden">
                <img id="silhouette-img" class="silhouette-img" src="" alt="">
            </div>

            <!-- 水平仪 -->
            <div id="level-indicator" class="overlay level-overlay">
                <div class="level-line"></div>
                <div class="level-text">正在校准...</div>
            </div>

            <!-- 闪烁警告框 -->
            <div id="angle-warning" class="hidden">
                <span class="warning-text">⚠️ 手机太往下啦，容易拍出小短腿！蹲低仰拍！</span>
            </div>

            <!-- 快门闪光效果 -->
            <div id="shutter-flash" class="shutter-flash hidden"></div>
        </div>

        <!-- 底部控制栏 -->
        <div class="controls-bar">
            <div class="modes">
                <button class="mode-btn active" data-mode="none" data-tip="">自由构图</button>
                <button class="mode-btn" data-mode="full" data-tip="">全身(显高)</button>
                <button class="mode-btn" data-mode="half" data-tip="">半身(回眸)</button>
                <button class="mode-btn" data-mode="close" data-tip="">特写(情绪)</button>
            </div>

            <div class="actions">
                <div class="left-actions">
                    <button id="camera-switch-btn" class="action-btn">🔄</button>
                    <button id="timer-btn" class="action-btn" data-timer="0">⏱️</button>
                </div>
                <button id="capture-btn" class="capture-btn">
                    <div class="inner-circle"></div>
                </button>
                <div class="right-actions">
                    <button id="grid-toggle-btn" class="action-btn active">#</button>
                    <button id="tips-refresh-btn" class="action-btn">💡</button>
                </div>
            </div>
        </div>

        <!-- 拍照后的预览和保存层 -->
        <div id="photo-preview-layer" class="hidden">
            <img id="photo-preview" src="" alt="照片预览">
            <div class="preview-actions">
                <button id="retake-btn" class="preview-btn retake">✕ 重拍</button>
                <button id="save-btn" class="preview-btn save">✓ 保存到相册</button>
            </div>
        </div>

        <!-- 隐藏的Canvas用于截图 -->
        <canvas id="capture-canvas" class="hidden"></canvas>
    </div>

    <script src="app.js"></script>
</body>

</html>
